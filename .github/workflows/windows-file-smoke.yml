name: Windows file safety smoke
on:
  push:
    branches: [ci/windows-file-smoke]
    paths: [.github/workflows/windows-file-smoke.yml]
permissions:
  contents: read
jobs:
  windows-file-smoke:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Check Windows non-replacing file publication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ("rapier-file-smoke-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $east = Join-Path $root 'east'
            $west = Join-Path $root 'west'
            New-Item -ItemType Directory -Path $east,$west | Out-Null
            $a = Join-Path $east 'IMG_0100.jpg'
            $b = Join-Path $west 'IMG_0100.jpg'
            [IO.File]::WriteAllText($a, 'synthetic east source')
            [IO.File]::WriteAllText($b, 'synthetic west source')
            function Hash([string]$p) { (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash }
            $ah = Hash $a
            $bh = Hash $b
            if ($ah -eq $bh) { throw 'Setup: same-name fixtures must differ' }
            $stage = Join-Path $east 'temporary.out'
            [IO.File]::WriteAllText($stage, 'synthetic derived output')
            $stagedHash = Hash $stage
            $collision = $false
            try { [IO.File]::Move($stage, (Join-Path $east 'img_0100.JPG'), $false) }
            catch [IO.IOException] { $collision = $true }
            if (!$collision -or (Hash $a) -ne $ah -or (Hash $stage) -ne $stagedHash) {
              throw 'Case-only collision was not safely refused'
            }
            $published = Join-Path $east 'IMG_0100-new.jxl'
            [IO.File]::Move($stage, $published, $false)
            if ((Hash $published) -ne $stagedHash -or (Hash $a) -ne $ah -or (Hash $b) -ne $bh) {
              throw 'Fresh publish changed an input or output'
            }
            $wvPaths = @(
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            )
            $runtime = @($wvPaths | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1)
            if ($runtime.Count -eq 0) { $runtime = @('not detected') }
            @(
              '## Windows file safety smoke'
              "- Windows: $([System.Environment]::OSVersion.VersionString)"
              "- WebView2 registry: $($runtime[0]) (not launched)"
              '- PASS: case-only collision refused without changing input or temporary file'
              '- PASS: same-named originals in separate folders kept their distinct hashes'
              '- PASS: fresh non-replacing publication read back with the expected hash'
              '- UNRUN: app compilation, package installation, codec, Explorer and the app itself'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
      - name: Validate an NTFS denied-subtree fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ("windows-acl-smoke-" + [Guid]::NewGuid().ToString("N"))
          $blocked = Join-Path $root 'blocked'
          $visible = Join-Path $root 'visible'
          New-Item -ItemType Directory -Path $blocked,$visible -Force | Out-Null
          $hiddenFile = Join-Path $blocked 'hidden.fixture'
          $visibleFile = Join-Path $visible 'visible.fixture'
          [IO.File]::WriteAllText($hiddenFile, 'synthetic hidden')
          [IO.File]::WriteAllText($visibleFile, 'synthetic visible')
          $beforeHidden = (Get-FileHash -LiteralPath $hiddenFile).Hash
          $beforeVisible = (Get-FileHash -LiteralPath $visibleFile).Hash
          $acl = Get-Acl -LiteralPath $blocked
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          try {
            & icacls.exe $blocked /deny ('*' + $sid + ':(RD)')
            if ($LASTEXITCODE -ne 0) { throw 'Fixture ACL setup failed.' }
            $denied = $false
            try { [IO.Directory]::GetFiles($blocked) | Out-Null }
            catch [UnauthorizedAccessException] { $denied = $true }
            if (!$denied) { throw 'Invalid fixture: blocked folder is still enumerable.' }
            $files = @([IO.Directory]::GetFiles($visible))
            if ($files.Count -ne 1 -or $files[0] -ne $visibleFile) {
              throw 'Invalid fixture: accessible sibling was not enumerable.'
            }
          } finally {
            Set-Acl -LiteralPath $blocked -AclObject $acl
            try {
              if ((Get-FileHash -LiteralPath $hiddenFile).Hash -ne $beforeHidden -or
                  (Get-FileHash -LiteralPath $visibleFile).Hash -ne $beforeVisible) {
                throw 'Fixture bytes changed.'
              }
            } finally { Remove-Item -LiteralPath $root -Recurse -Force }
          }
          '- PASS: this Windows runner can produce a genuine denied folder, keep its sibling accessible, and restore the fixture ACL without changing the files. App behavior is UNRUN.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
