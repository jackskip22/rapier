# The contributor licence check (CONTRIBUTING.md, CLA.md), run by this repository's own workflow token: no outside
# service holds a token for the owner's account. A contributor signs once by commenting the sentence the check asks
# for; the signature is a line in signatures/cla.json on main. The action is pinned to a commit, never a moving tag.
# It never checks out the pull request's code, which is what makes pull_request_target safe here.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@58daaf842ac3e26d08c2bdf26770d6e9c5b965a9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/jackskip22/rapier/blob/main/docs/CLA.md
          branch: main
          allowlist: jackskip22,dependabot[bot],github-actions[bot]
