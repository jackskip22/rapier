name: Windows converter and Watercolor checks
on:
  push:
    branches: [ci/windows-converter-check-20261128, ci/windows-converter-check-2-20261128]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Archive keeps every file it is not sure of (before and after the fix, on NTFS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cells = 'part-exists part-denied walk-part receipt-flush receipt-short written-open written-write written-flush saved-open saved-write saved-flush stop-replacement fail-replacement verify-replacement stop-original-gone restart-original-gone restart-replacement verify-locks normal owned-part self-test'.Split(' ')
          $controls = @('normal', 'owned-part', 'self-test')
          $rows = @{}
          foreach ($side in 'base', 'after') {
            foreach ($cell in $cells) {
              $work = Join-Path $env:RUNNER_TEMP ("cell-" + $side + "-" + $cell)
              New-Item -ItemType Directory -Force -Path $work | Out-Null
              Push-Location $work
              $text = & (Join-Path $env:GITHUB_WORKSPACE "ci-inputs/archive-$side.exe") $cell 2>&1 | Out-String
              $code = $LASTEXITCODE
              Pop-Location
              $row = $null
              foreach ($line in $text -split "`n") { try { $j = $line.Trim() | ConvertFrom-Json -ErrorAction Stop; if ($j.case -eq $cell) { $row = $j } } catch {} }
              $pass = $row -ne $null -and $row.pass -eq $true -and $code -eq 0
              $rows["$side/$cell"] = $pass
              Write-Output "$side $cell exit=$code pass=$pass $($text.Trim() -replace "`r?`n", ' | ')"
            }
          }
          $problems = @()
          foreach ($cell in $cells) {
            if (-not $rows["after/$cell"]) { $problems += "$cell candidate failed" }
            if ($controls -contains $cell) { if (-not $rows["base/$cell"]) { $problems += "$cell base control failed" } }
            elseif ($rows["base/$cell"]) { $problems += "$cell base did not reproduce the bug" }
          }
          if ($problems.Count -eq 0) { echo "::notice title=Archive custody::PASS: 18 safety cases red before the fix and green after, 3 controls green, on Windows NTFS" }
          else { foreach ($p in $problems | Select-Object -First 9) { echo "::error title=Archive custody::$p" } }
      - name: Self-tests on real Windows (converter, Watercolor)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($pair in @(@('converter', 'ci-inputs/RapierJxlConverter.exe'), @('watercolor', 'ci-inputs/watercolor/rapier-host.exe'))) {
            $exe = Join-Path $env:GITHUB_WORKSPACE $pair[1]
            if (-not (Test-Path $exe)) { continue }
            $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
            echo "::notice title=Self-test $($pair[0])::exit $($p.ExitCode) on $([System.Environment]::OSVersion.VersionString), Developer Mode $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense)"
          }
      - name: A real Archive run in WebView2 (6 photos, effort 7), every original unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\ci'; $photos = "$root\photos"; New-Item -ItemType Directory -Force -Path $photos | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\ci-inputs\photos\*.jpg" $photos
          $before = @{}; Get-ChildItem $photos -Filter *.jpg | ForEach-Object { $before[$_.Name] = (Get-FileHash $_.FullName).Hash }
          Invoke-WebRequest https://nodejs.org/dist/v22.23.4/node-v22.23.4-win-x64.zip -OutFile "$root\node.zip"
          Expand-Archive "$root\node.zip" $root; $node = "$root\node-v22.23.4-win-x64\node.exe"
          $dir = "$env:LOCALAPPDATA\RapierJxlConverter"; New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @{ root = $photos; effort = 7; remove = $false; watch = $false; resume = $false } | ConvertTo-Json -Compress | Set-Content "$dir\archive.json" -Encoding ASCII
          $env:RAPIER_TEST_DEVTOOLS_PORT = '9301'
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE\ci-inputs\RapierJxlConverter.exe" -PassThru
          Start-Sleep 8
          $wait = & $node "$env:GITHUB_WORKSPACE\ci-inputs\drive.mjs" 9301 wait 2>&1 | Out-String
          $run = & $node "$env:GITHUB_WORKSPACE\ci-inputs\drive.mjs" 9301 archive 7 12 2>&1 | Out-String
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $jxl = @(Get-ChildItem $photos -Filter *.jxl).Count
          $same = @($before.Keys | Where-Object { (Get-FileHash (Join-Path $photos $_)).Hash -eq $before[$_] }).Count
          $lines = @($run.Trim() -split "`r?`n"); $last = $lines[-1]
          echo "::notice title=Live Archive::drive exit $code, $jxl JPEG XL written for $($before.Count) JPEGs, $same of $($before.Count) originals byte for byte unchanged"
          echo "::notice title=Live Archive result::$($last.Substring(0, [Math]::Min(400, $last.Length)))"
          Write-Output $wait; Write-Output $run
