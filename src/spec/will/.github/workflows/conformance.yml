name: conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
      - run: node will.mjs check vectors.json
      - name: README has no live marker
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {parse} from "./will.mjs";
            const result = parse(readFileSync("README.md"));
            if (result.regions.length || result.faults.length) process.exit(1);'
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.17'
      - run: python hosts/python/will.py check vectors.json
      - run: python hosts/check-adapter.py python hosts/python/will.py
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.22.12'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.17'
      - run: go run ./cmd/will check ../../vectors.json
        working-directory: hosts/go
        env:
          GOTOOLCHAIN: local
      - run: python ../check-adapter.py go run ./cmd/will
        working-directory: hosts/go
        env:
          GOTOOLCHAIN: local
