[package]
name = "rapier-jxl-encoder"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jixel = { path = "target/jixel", default-features = false }

[profile.release]
# The z build is smaller but slows Modular lossless by roughly a third.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
